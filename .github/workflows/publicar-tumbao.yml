# Publica la página de reservas de Tumbao en GitHub Pages.
#
# Se dispara a mano (Actions → Run workflow) y también solo cada vez que
# cambie algo dentro de tumbao-reservas/web/, así la página en línea nunca
# se queda atrás del repo.
#
# `enablement: true` prende GitHub Pages la primera vez, para no tener que
# ir a Settings a activarlo.
name: Publicar pagina de Tumbao

on:
  workflow_dispatch:
  push:
    branches:
      - claude/tumbao-reservas-n8n-831zit
    paths:
      - 'tumbao-reservas/web/**'
      - '.github/workflows/publicar-tumbao.yml'

# Lo que necesita deploy-pages para subir sin credenciales aparte.
permissions:
  contents: read
  pages: write
  id-token: write

# Si se dispara dos veces seguidas, que la segunda espere en vez de
# pelearse con la primera: dejar el sitio a medio subir es peor.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.desplegar.outputs.page_url }}
    steps:
      - name: Bajar el repo
        uses: actions/checkout@v4

      - name: Preparar Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Sin Jekyll
        # Sin esto, Pages pasa el sitio por Jekyll y se come los archivos
        # que empiezan por guion bajo. Aqui no hay, pero tampoco hace
        # falta el procesamiento.
        run: touch tumbao-reservas/web/.nojekyll

      - name: Empaquetar solo la carpeta web
        uses: actions/upload-pages-artifact@v3
        with:
          path: tumbao-reservas/web

      - name: Desplegar
        id: desplegar
        uses: actions/deploy-pages@v4
