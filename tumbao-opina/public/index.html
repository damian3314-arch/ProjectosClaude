<!doctype html>
<html lang="es-CO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cuéntanos · Tumbao</title>
<meta name="description" content="Dos minutos para contarnos cómo te ha ido en Tumbao.">
<meta name="theme-color" content="#0d0b0f">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230d0b0f'/%3E%3Ctext x='32' y='45' font-family='system-ui,sans-serif' font-size='38' font-weight='800' text-anchor='middle' fill='%23ff6b35'%3ET%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --bg:#0d0b0f; --bg-2:#161219; --bg-3:#1f1a24;
    --line:#312a38; --tx:#f4eff6; --tx-2:#b3a7bd; --tx-3:#7d7186;
    --hot:#ff6b35; --gold:#ffc14d; --ok:#4ade80; --bad:#ff6b81;
    --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  *,*::before,*::after{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--tx);font-family:var(--sans);
    line-height:1.5;-webkit-font-smoothing:antialiased;
    background-image:radial-gradient(60rem 34rem at 50% -10rem,rgba(255,107,53,.15),transparent 65%);
    display:flex;flex-direction:column;
  }
  header{
    padding:.9rem 1rem;border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:.7rem;flex:none;
    background:rgba(13,11,15,.85);backdrop-filter:blur(8px);
    position:sticky;top:0;z-index:5;
  }
  .logo{
    font-size:1.15rem;font-weight:800;letter-spacing:-.02em;margin:0;
    background:linear-gradient(100deg,var(--gold),var(--hot) 60%,#ff4f7d);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  header small{color:var(--tx-3);font-size:.78rem}

  /* Dentro de la burbuja de tumbaobaila.com el encabezado sobra: la
     ventanita ya tiene su propia barra con el nombre y la X, y repetir
     "TUMBAO" dos veces en 40 mm de alto se come el espacio del chat,
     que es lo único que importa ahí. */
  body.burbuja header{display:none}
  body.burbuja main{padding-top:1rem}

  main{
    flex:1;overflow-y:auto;padding:1.1rem 1rem 1.4rem;
    max-width:40rem;width:100%;margin:0 auto;
  }
  .msg{display:flex;margin-bottom:.75rem;animation:sube .25s ease both}
  @keyframes sube{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.msg{animation:none}}
  .msg .burbuja{
    max-width:82%;padding:.7rem .95rem;border-radius:16px;
    font-size:.97rem;white-space:pre-wrap;word-wrap:break-word;
  }
  .msg.bot .burbuja{background:var(--bg-2);border:1px solid var(--line);border-bottom-left-radius:5px}
  .msg.yo{justify-content:flex-end}
  .msg.yo .burbuja{
    background:linear-gradient(160deg,var(--hot),#e0491d);color:#fff;
    border-bottom-right-radius:5px;
  }
  .msg .burbuja .medio{
    display:block;font-size:.72rem;opacity:.75;margin-bottom:.2rem;
  }
  .puntos{display:flex;gap:.25rem;padding:.85rem .95rem}
  .puntos i{
    width:.42rem;height:.42rem;border-radius:99px;background:var(--tx-3);
    animation:late 1.2s infinite;
  }
  .puntos i:nth-child(2){animation-delay:.18s}
  .puntos i:nth-child(3){animation-delay:.36s}
  @keyframes late{0%,60%,100%{opacity:.28}30%{opacity:1}}

  footer{
    flex:none;border-top:1px solid var(--line);padding:.7rem 1rem 1.1rem;
    background:rgba(13,11,15,.92);backdrop-filter:blur(8px);
    position:sticky;bottom:0;
  }
  .barra{display:flex;gap:.5rem;align-items:flex-end;max-width:40rem;margin:0 auto}
  textarea{
    flex:1;resize:none;background:var(--bg-2);border:1px solid var(--line);
    color:var(--tx);border-radius:14px;padding:.7rem .9rem;font:inherit;
    font-size:1rem;max-height:7rem;min-height:2.8rem;
  }
  textarea:focus{outline:none;border-color:var(--hot)}
  textarea::placeholder{color:var(--tx-3)}
  .ic{
    flex:none;width:2.8rem;height:2.8rem;border-radius:99px;cursor:pointer;
    background:var(--bg-3);border:1px solid var(--line);color:var(--tx-2);
    display:grid;place-items:center;font-size:1.15rem;transition:.15s;
  }
  .ic:hover:not(:disabled){border-color:var(--hot);color:var(--tx)}
  .ic:disabled{opacity:.4;cursor:not-allowed}
  .ic.enviar{background:linear-gradient(160deg,var(--hot),#e0491d);border-color:transparent;color:#fff}
  .ic.grabando{background:var(--bad);border-color:transparent;color:#fff;animation:pulso 1.1s infinite}
  @keyframes pulso{0%,100%{opacity:1}50%{opacity:.55}}
  .pie{
    text-align:center;font-size:.72rem;color:var(--tx-3);
    margin:.6rem auto 0;max-width:32rem;
  }
  .aviso{
    margin:.6rem auto 0;max-width:40rem;font-size:.82rem;padding:.55rem .8rem;
    border-radius:10px;background:rgba(255,107,129,.12);
    border:1px solid rgba(255,107,129,.35);color:#ffc9d1;
  }
  .fin{
    text-align:center;padding:1.6rem 1rem;color:var(--tx-2);
  }
  .fin .tic{
    width:3.2rem;height:3.2rem;border-radius:99px;margin:0 auto .8rem;
    background:rgba(74,222,128,.14);border:1px solid var(--ok);color:var(--ok);
    display:grid;place-items:center;font-size:1.6rem;
  }
  .fin b{color:var(--tx);display:block;font-size:1.05rem;margin-bottom:.3rem}
</style>
</head>
<body>
<script>
  // Lo pone el iframe con ?burbuja=1. Va aquí arriba y no en el script
  // de abajo para que el encabezado no llegue a pintarse y desaparecer.
  if (new URLSearchParams(location.search).has('burbuja')) {
    document.body.classList.add('burbuja');
  }
</script>

<header>
  <h1 class="logo">TUMBAO</h1>
  <small>cuéntanos cómo te ha ido</small>
</header>

<main id="hilo"></main>

<footer id="pie">
  <div class="barra">
    <button class="ic" id="foto" title="Enviar una foto" aria-label="Enviar una foto">🖼️</button>
    <button class="ic" id="voz"  title="Grabar una nota de voz" aria-label="Grabar una nota de voz">🎙️</button>
    <textarea id="caja" rows="1" placeholder="Escribe aquí…" aria-label="Tu mensaje"></textarea>
    <button class="ic enviar" id="enviar" title="Enviar" aria-label="Enviar">↑</button>
  </div>
  <div class="aviso" id="aviso" hidden></div>
  <p class="pie">
    Lo que nos cuentes lo lee el equipo de Tumbao para mejorar.
    Las notas de voz se convierten en texto y <b>el audio no se guarda</b>.
  </p>
  <input type="file" id="archivo" accept="image/*" hidden>
</footer>

<script>
const $ = s => document.querySelector(s);
const hilo = $('#hilo');

// Un id por conversación, en el navegador. Si recarga, sigue la misma.
const CONV = (() => {
  const k = 'tumbao_opina_id';
  let v = null;
  try { v = localStorage.getItem(k); } catch (_) {}
  if (!v) {
    v = (crypto.randomUUID ? crypto.randomUUID()
                           : String(Date.now()) + Math.random().toString(16).slice(2));
    try { localStorage.setItem(k, v); } catch (_) {}
  }
  return v;
})();

let historia = [];      // lo que se le manda al modelo
let ocupado = false;
let terminado = false;

function burbuja(de, texto, medio){
  const d = document.createElement('div');
  d.className = 'msg ' + (de === 'bot' ? 'bot' : 'yo');
  const etiqueta = medio === 'voz' ? '🎙️ nota de voz'
                 : medio === 'imagen' ? '🖼️ imagen' : '';
  d.innerHTML = '<div class="burbuja">' +
    (etiqueta ? '<span class="medio">' + etiqueta + '</span>' : '') +
    texto.replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c])) +
    '</div>';
  hilo.appendChild(d);
  hilo.scrollTop = hilo.scrollHeight;
  return d;
}

function pensando(si){
  let p = $('#pensando');
  if (si && !p){
    p = document.createElement('div');
    p.id = 'pensando'; p.className = 'msg bot';
    p.innerHTML = '<div class="burbuja puntos"><i></i><i></i><i></i></div>';
    hilo.appendChild(p);
    hilo.scrollTop = hilo.scrollHeight;
  } else if (!si && p) p.remove();
}

function aviso(t){
  const a = $('#aviso');
  a.textContent = t || '';
  a.hidden = !t;
}

async function api(ruta, cuerpo, esForm){
  const r = await fetch(ruta, esForm
    ? { method:'POST', body: cuerpo }
    : { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(cuerpo) });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.mensaje || d.error || 'no_disponible');
  return d;
}

async function turno(texto, medio){
  if (ocupado || terminado) return;
  ocupado = true; aviso('');
  if (texto) burbuja('yo', texto, medio);
  pensando(true);
  try {
    const d = await api('/api/mensaje', { conversacion: CONV, historia, texto, medio });
    pensando(false);
    if (texto) historia.push({ role:'user', content: texto });
    historia.push({ role:'assistant', content: d.respuesta });
    burbuja('bot', d.respuesta);
    if (d.listo) await cerrar();
  } catch (e){
    pensando(false);
    // Nunca dejar al cliente mirando una pantalla muerta: se le dice qué
    // pasó y su mensaje sigue en pantalla para que reintente.
    aviso('Se nos cayó la conexión un momento. Vuelve a intentarlo.');
  } finally {
    ocupado = false;
  }
}

async function cerrar(){
  terminado = true;
  try { await api('/api/cerrar', { conversacion: CONV, historia }); } catch (_) {}
  $('#pie').innerHTML =
    '<div class="fin"><div class="tic">✓</div>' +
    '<b>Gracias, de verdad.</b>' +
    'Lo que nos contaste lo leemos esta semana.</div>';
  try { localStorage.removeItem('tumbao_opina_id'); } catch (_) {}
}

/* ---------- escribir ---------- */
const caja = $('#caja');
caja.addEventListener('input', () => {
  caja.style.height = 'auto';
  caja.style.height = Math.min(caja.scrollHeight, 112) + 'px';
});
caja.addEventListener('keydown', e => {
  // Enter envía en computador; en celular hace salto de línea, que es
  // lo que la gente espera de un chat.
  if (e.key === 'Enter' && !e.shiftKey && window.matchMedia('(min-width: 700px)').matches){
    e.preventDefault(); mandar();
  }
});
$('#enviar').addEventListener('click', mandar);

function mandar(){
  const t = caja.value.trim();
  if (!t) return;
  caja.value = ''; caja.style.height = 'auto';
  turno(t, 'texto');
}

/* ---------- nota de voz ---------- */
let grabadora = null, trozos = [];
$('#voz').addEventListener('click', async () => {
  if (terminado) return;
  if (grabadora && grabadora.state === 'recording'){ grabadora.stop(); return; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    trozos = [];
    grabadora = new MediaRecorder(stream);
    grabadora.ondataavailable = e => { if (e.data.size) trozos.push(e.data); };
    grabadora.onstop = async () => {
      stream.getTracks().forEach(t => t.stop());
      $('#voz').classList.remove('grabando');
      $('#voz').textContent = '🎙️';
      const blob = new Blob(trozos, { type: 'audio/webm' });
      if (blob.size < 1200){ aviso('La nota salió muy corta.'); return; }
      pensando(true);
      try {
        const fd = new FormData();
        fd.append('audio', blob, 'nota.webm');
        const d = await api('/api/voz', fd, true);
        pensando(false);
        if (!d.texto){ aviso('No alcancé a entender el audio. ¿Lo intentas otra vez?'); return; }
        turno(d.texto, 'voz');
      } catch (_){
        pensando(false);
        aviso('No pude procesar la nota de voz. Puedes escribirlo si prefieres.');
      }
    };
    grabadora.start();
    $('#voz').classList.add('grabando');
    $('#voz').textContent = '⏹';
    aviso('Grabando… toca el cuadrito para terminar.');
  } catch (_){
    aviso('No pudimos usar el micrófono. Revisa los permisos del navegador.');
  }
});

/* ---------- imagen ---------- */
$('#foto').addEventListener('click', () => { if (!terminado) $('#archivo').click(); });
$('#archivo').addEventListener('change', async e => {
  const f = e.target.files && e.target.files[0];
  e.target.value = '';
  if (!f) return;
  if (f.size > 4.5 * 1024 * 1024){ aviso('Esa imagen pesa mucho. Manda una más liviana.'); return; }
  const lector = new FileReader();
  lector.onload = async () => {
    pensando(true);
    try {
      const d = await api('/api/imagen', { imagen: lector.result });
      pensando(false);
      turno(d.texto || 'Mandé una imagen.', 'imagen');
    } catch (_){
      pensando(false);
      aviso('No pude leer esa imagen.');
    }
  };
  lector.readAsDataURL(f);
});

/* ---------- arranque ---------- */
turno('', 'texto');
</script>
</body>
</html>
