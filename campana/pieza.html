<!doctype html>
<meta charset="utf-8">
<title>Tumbao · aniversario</title>
<style>
  @font-face{font-family:Fredoka;src:url(fuentes/Fredoka-400.ttf);font-weight:400}
  @font-face{font-family:Fredoka;src:url(fuentes/Fredoka-500.ttf);font-weight:500}
  @font-face{font-family:Fredoka;src:url(fuentes/Fredoka-600.ttf);font-weight:600}
  @font-face{font-family:Fredoka;src:url(fuentes/Fredoka-700.ttf);font-weight:700}
  @font-face{font-family:Caveat;src:url(fuentes/Caveat-600.ttf);font-weight:600}
  @font-face{font-family:Caveat;src:url(fuentes/Caveat-700.ttf);font-weight:700}

  /* LOS COLORES SON LOS DE LA MARCA, no una paleta que se le parezca.
     Salen del logo y del perfil: el lila del fondo, el naranja del
     logotipo y el magenta de «Baila pa' sanar». */
  :root{
    --lila:#EADCFA;
    --naranja:#EE6B31;
    --magenta:#E8226A;
    --morado:#3B2258;
    --amarillo:#F7DE4A;
    --margen:96px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1920px;overflow:hidden}
  body{background:var(--lila);color:var(--morado);
       font-family:Fredoka,sans-serif;-webkit-font-smoothing:antialiased;
       position:relative}

  /* ── la foto, teñida de Tumbao ──────────────────────────────────
     La foto de la puerta le gustó a Damián, pero venía en ámbar y negro:
     los colores de otra marca. Aquí se pasa a blanco y negro y se vuelve
     a teñir con los dos colores de la casa. Es un duotono clásico:

       multiply con el LILA   → los blancos se vuelven lila
       screen   con el MAGENTA → los negros se vuelven magenta

     Teñir es mejor que pedirle otra foto a un modelo: la foto que a él
     le gustó se queda, y solo cambia la luz. */
  #foto{position:absolute;left:0;right:0;top:0;height:900px;overflow:hidden}
  #foto .img{position:absolute;inset:0;background-size:cover;
             background-position:center;filter:grayscale(1) contrast(1.02) brightness(1.08)}
  /* A media caña: teñir no es tapar. Con el magenta al 72% la puerta y
     la luz desaparecían y quedaba una mancha rosa. */
  #foto .tinte-a{position:absolute;inset:0;background:var(--magenta);
                 mix-blend-mode:screen;opacity:.42}
  #foto .tinte-b{position:absolute;inset:0;background:var(--lila);
                 mix-blend-mode:multiply}
  /* El lila se come la foto por abajo: así el texto siempre cae sobre
     color plano y no hay que rezar para que se lea. */
  #fundido{position:absolute;left:0;right:0;top:540px;height:380px;
           background:linear-gradient(to bottom,
             rgba(234,220,250,0) 0%, rgba(234,220,250,.88) 58%, var(--lila) 100%)}

  .zona{position:absolute;left:var(--margen);right:var(--margen)}
  #marca{top:250px}
  /* La frase se centra ÓPTICAMENTE, un poco por encima del centro: un
     texto centrado exacto siempre parece caído. El @ va pegado abajo. */
  #cuerpo{top:50%;transform:translateY(-54%)}
  #arroba{bottom:300px}

  /* El logotipo escrito, no la imagen: así la pieza no pesa nada y el
     tamaño se elige en vez de heredarlo de un PNG. */
  .logo{font-size:64px;font-weight:600;color:var(--naranja);line-height:1}
  .lema{font-family:Caveat,cursive;font-size:44px;font-weight:700;
        color:var(--magenta);margin-top:-6px}

  h1{font-size:150px;font-weight:600;line-height:.98;letter-spacing:-.01em;
     color:var(--naranja);margin-bottom:26px}
  h1 em{font-style:normal;color:var(--magenta)}
  h1.corto{font-size:118px}

  /* El segundo renglón de la frase de Damián. Va en cuerpo mediano y en
     morado: si fuera del tamaño del titular la pieza volvería a ser un
     muro, y si fuera naranja no habría jerarquía, solo dos gritos. */
  .segunda{font-size:62px;font-weight:500;line-height:1.12;
           color:var(--morado);margin-bottom:26px}

  /* El subrayado a mano. Es el ÚNICO adorno que se deja: es la firma de
     Tumbao —está en todas sus piezas— y sin él esto podría ser de
     cualquiera. Un trazo, no un montón de garabatos. */
  .trazo{display:block;width:100%;height:30px;margin:-4px 0 34px}
  .trazo path{fill:none;stroke:var(--amarillo);stroke-width:14;
              stroke-linecap:round}

  .abajo{font-family:Caveat,cursive;font-size:60px;font-weight:700;
         color:var(--magenta);line-height:1.15}
  .arroba{font-size:34px;font-weight:500;color:var(--morado);opacity:.62}

  /* CON FOTO LA RETÍCULA CAMBIA, y cambia aquí y no con estilos puestos
     a mano desde el JS: la versión anterior empujaba tres bloques por
     separado y la marca acababa escrita encima del titular. Con foto hay
     UN solo bloque que fluye. */
  body.confoto #marca{position:static;margin-bottom:34px}
  body.confoto #cuerpo{top:920px;bottom:auto;transform:none}
  body.confoto h1{font-size:104px;margin-bottom:20px}
  body.confoto h1.corto{font-size:88px}
  body.confoto .segunda{font-size:52px;margin-bottom:20px}
  body.confoto .trazo{height:24px;margin:-4px 0 26px}
  body.confoto .abajo{font-size:52px}
</style>

<div id="foto" hidden>
  <div class="img" id="img"></div>
  <div class="tinte-a"></div>
  <div class="tinte-b"></div>
</div>
<div id="fundido" hidden></div>

<div class="zona" id="marca">
  <div class="logo">TUMBAO</div>
  <div class="lema">Baila pa' sanar</div>
</div>

<div class="zona" id="cuerpo">
  <h1 id="titular"></h1>
  <div class="segunda" id="segunda"></div>
  <svg class="trazo" id="trazo" viewBox="0 0 600 26" preserveAspectRatio="none" hidden>
    <path d="M6 18 C 120 6, 240 22, 360 11 S 520 6, 594 15"/>
  </svg>
  <div class="abajo" id="abajo"></div>
</div>

<div class="zona arroba" id="arroba">@tumbao.bca</div>

<script>
/* LA FRASE DE LA CAMPAÑA, tal cual la escribió Damián. Vive aquí y solo
   aquí: la misma sale en la página y en el estado de WhatsApp. Cambiarla
   es cambiar estas dos líneas y volver a sacar las piezas; no hay que
   retocar ninguna imagen a mano. */
const FRASE    = '¡PREPÁRATE!';
const SEGUNDA  = 'Este aniversario es de todos';

const PIEZAS = {
  // La primera, sin foto: es la que se manda sola y la que aguanta
  // repetirse. Solo la frase.
  p1: { titular: FRASE, segunda: SEGUNDA, trazo: true, abajo: 'Muy pronto' },

  // Con la puerta. La misma frase, para que las dos se lean como una.
  p2: { titular: FRASE, segunda: SEGUNDA, trazo: true, abajo: 'Muy pronto',
        foto: 'puerta.jpg' },

  // La que pide ideas. No anuncia: pregunta. Si el aniversario es «de
  // todos» y nadie puede decir nada, la frase se queda en frase.
  p3: { titular: '¿CÓMO SERÍA<br>TU ANIVERSARIO<br><em>PERFECTO?</em>', corto: true,
        segunda: 'Cuéntanos tu idea en el chat de tumbaobaila.com',
        trazo: true, foto: 'puerta.jpg' }
};

function pintar(id) {
  const p = PIEZAS[id];
  const h1 = document.getElementById('titular');
  h1.innerHTML = p.titular;
  h1.classList.toggle('corto', !!p.corto);
  const seg = document.getElementById('segunda');
  seg.textContent = p.segunda || '';
  seg.hidden = !p.segunda;
  document.getElementById('trazo').hidden = !p.trazo;
  const ab = document.getElementById('abajo');
  ab.textContent = p.abajo || '';
  ab.hidden = !p.abajo;

  if (p.foto) {
    document.body.classList.add('confoto');
    document.getElementById('img').style.backgroundImage = 'url(' + p.foto + ')';
    document.getElementById('foto').hidden = false;
    document.getElementById('fundido').hidden = false;
    // La marca se mete DENTRO del bloque que fluye, para que el titular
    // empiece donde ella termina y no donde diga un número.
    const c = document.getElementById('cuerpo');
    c.insertBefore(document.getElementById('marca'), c.firstChild);
  }
}
window.pintar = pintar;
pintar(new URLSearchParams(location.search).get('p') || 'p1');
</script>
