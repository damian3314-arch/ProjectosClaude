    <script>
      // Chispas con posiciones fijas (generador con semilla: el mismo video en cada render).
      (function () {
        let s = 20261012;
        const azar = () => ((s = (s * 1664525 + 1013904223) % 4294967296) / 4294967296);
        const cont = document.getElementById('chispas');
        for (let i = 0; i < 14; i++) {
          const d = document.createElement('div');
          d.className = 'chispa';
          d.id = 'chispa-' + i;
          d.style.left = '350px';
          d.style.top = '547px';
          d.dataset.ang = String((i / 14) * Math.PI * 2 + azar() * 0.4);
          d.dataset.dist = String(150 + azar() * 140);
          d.dataset.esc = String(0.6 + azar() * 0.9);
          cont.appendChild(d);
        }
      })();

      const tl = gsap.timeline({ paused: true });
      // 128 BPM: un tiempo = 0,46875 s; un compás = 1,875 s. Las dos caídas: 3,75 s («CONSTANCIA») y 16,875 s (cierre).
      const B = 0.46875, C = B * 4, FIN = 22.5;
      const CORTES = [3.75, 5.625, 7.5, 11.25, 14.0625, 16.875];

      // ── fondo ──
      tl.fromTo('#luz-a', { scale: 1, x: 0 }, { scale: 1.14, x: 60, duration: FIN / 2, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 0);
      tl.fromTo('#luz-b', { scale: 0.9, y: 0 }, { scale: 1.1, y: -160, duration: FIN, ease: 'sine.inOut' }, 0);
      tl.fromTo('#luz-c', { scale: 1, x: 0 }, { scale: 1.2, x: 120, duration: FIN, ease: 'sine.inOut' }, 0);
      tl.fromTo('#led-1', { rotation: -11, x: -140 }, { rotation: -11, x: 140, duration: FIN, ease: 'none' }, 0);
      tl.fromTo('#led-2', { rotation: 8, x: 110 }, { rotation: 8, x: -110, duration: FIN, ease: 'none' }, 0);
      tl.fromTo('#led-3', { rotation: -5, x: -70 }, { rotation: -5, x: 70, duration: FIN, ease: 'none' }, 0);
      tl.set(['#led-1', '#led-2', '#led-3'], { opacity: 0 }, 0);
      [[0.10, 1], [0.16, 0.15], [0.22, 1], [0.28, 0.3], [0.38, 1], [0.44, 0.2], [0.52, 1]].forEach(([t, o]) => {
        tl.set('#led-1', { opacity: o }, t);
        tl.set('#led-2', { opacity: o * 0.8 }, t + 0.04);
        tl.set('#led-3', { opacity: o * 0.7 }, t + 0.08);
      });
      // En las caídas las tiras laten con el bombo.
      [[3.75, 5.625], [16.875, 22.0]].forEach(([a, b]) => {
        for (let t = a; t < b - 0.01; t += B) tl.fromTo('#led-1', { opacity: 1 }, { opacity: 0.55, duration: B * 0.9, ease: 'power2.out', immediateRender: false }, t);
      });
      // Un barrido de luz en cada corte.
      tl.set('#rayo', { opacity: 0 }, 0);
      CORTES.forEach((t) => {
        tl.fromTo('#rayo', { x: -900, rotation: -12 }, { x: 900, rotation: -12, duration: 0.5, ease: 'power2.inOut', immediateRender: false }, t - 0.28);
        tl.to('#rayo', { opacity: 1, duration: 0.18, ease: 'power1.out' }, t - 0.28);
        tl.to('#rayo', { opacity: 0, duration: 0.22, ease: 'power1.in' }, t - 0.06);
      });
      // Destello en las dos caídas.
      tl.set('#flash', { opacity: 0 }, 0);
      [3.75, 16.875].forEach((t) => {
        tl.to('#flash', { opacity: 0.85, duration: 0.04 }, t);
        tl.to('#flash', { opacity: 0, duration: 0.4, ease: 'power2.out' }, t + 0.05);
      });

      // ── 1 · gancho (0–3,75): las palabras entran a corcheas; «con ganas» se prende en neón y luego se tacha ──
      ['#w1', '#w2', '#w3', '#w4', '#w5'].forEach((w, i) => {
        tl.fromTo(w, { opacity: 0, y: 40, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.22, ease: 'back.out(2)' }, 0.234 + i * (B / 2));
      });
      tl.set('#g-ganas-tx', { opacity: 0 }, 0);
      [[1.406, 1], [1.46, 0.1], [1.52, 1], [1.58, 0.3], [1.66, 1]].forEach(([t, o]) => tl.set('#g-ganas-tx', { opacity: o }, t));
      tl.fromTo('#g-tacha', { scaleX: 0 }, { scaleX: 1, duration: 0.22, ease: 'power3.out' }, 3.05);
      tl.to('#g-ganas-tx', { opacity: 0.35, duration: 0.15 }, 3.1);
      tl.fromTo('#g-grupo', { scale: 1 }, { scale: 1.04, duration: 3.1, ease: 'none' }, 0.4);
      tl.to('#g-grupo', { scale: 1.3, opacity: 0, duration: 0.2, ease: 'power2.in' }, 3.55);

      // ── 2 · la caída (3,75–5,625) ──
      tl.fromTo('#k-grupo', { scale: 1.55, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.38, ease: 'power4.out' }, 3.75);
      tl.fromTo('#k-grupo', { x: 0 }, { keyframes: [{ x: 16, duration: 0.04 }, { x: -13, duration: 0.05 }, { x: 9, duration: 0.05 }, { x: -5, duration: 0.05 }, { x: 0, duration: 0.06 }], immediateRender: false }, 3.75);
      tl.fromTo('#k-b', { scaleX: 1.22 }, { scaleX: 1, duration: 0.5, ease: 'power3.out' }, 3.75);
      tl.to('#k-grupo', { opacity: 0, y: -110, duration: 0.2, ease: 'power2.in' }, 5.43);

      // ── 2b · «Rétate a seguir» (5,625–7,5) ──
      tl.fromTo('#r-a', { opacity: 0, scale: 1.6 }, { opacity: 1, scale: 1, duration: 0.35, ease: 'power4.out' }, 5.625);
      tl.fromTo('#r-caja-fondo', { scaleX: 0 }, { scaleX: 1, duration: 0.28, ease: 'power3.out' }, 5.7);
      tl.fromTo('#r-b', { opacity: 0, y: 70 }, { opacity: 1, y: 0, duration: 0.3, ease: 'power3.out' }, 5.78);
      tl.fromTo('#r-sub', { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.3, ease: 'power3.out' }, 5.9);
      tl.fromTo('#r-grupo', { y: 0 }, { y: -18, duration: 1.28, ease: 'none' }, 6.0);
      tl.to('#r-grupo', { opacity: 0, y: -110, duration: 0.2, ease: 'power2.in' }, 7.3);

      // ── 3-5 · el celular (7,5–17,2) ──
      tl.fromTo('#telefono', { y: 1000, rotation: 5 }, { y: 0, rotation: 0, duration: 0.7, ease: 'power3.out' }, 7.5);
      tl.fromTo('#rot-num', { scale: 0, rotation: -20 }, { scale: 1, rotation: 0, duration: 0.4, ease: 'back.out(1.8)' }, 7.6);
      tl.set(['#n2', '#n3'], { yPercent: 100, opacity: 0 }, 0);
      tl.set(['#p2', '#p3', '#sub2', '#sub3'], { opacity: 0 }, 0);
      tl.fromTo('#p1', { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.35, ease: 'power3.out' }, 7.7);
      tl.fromTo('#sub1', { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.35, ease: 'power3.out' }, 7.85);
      const cambio = (t, sale, entra) => {
        tl.to('#n' + sale, { yPercent: -100, duration: 0.3, ease: 'power3.inOut' }, t);
        tl.set('#n' + sale, { opacity: 0 }, t + 0.31);
        tl.set('#n' + entra, { opacity: 1 }, t);
        tl.fromTo('#n' + entra, { yPercent: 100 }, { yPercent: 0, duration: 0.3, ease: 'power3.inOut', immediateRender: false }, t);
