<!doctype html>
<html lang="es" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="vendor/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #140b06; }
      #root { width: 100%; height: 100%; position: relative; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      #glow { position: absolute; left: 540px; top: 960px; width: 1400px; height: 1400px; margin: -700px 0 0 -700px;
              border-radius: 50%; background: radial-gradient(circle, #ff7a1a 0%, rgba(255,122,26,0) 60%); }
      #marca { position: absolute; top: 760px; width: 100%; text-align: center; color: #fff4ea;
               font-size: 190px; font-weight: 800; letter-spacing: -0.04em; }
      #lema { position: absolute; top: 1010px; width: 100%; text-align: center; color: #ffb27a;
              font-size: 64px; font-weight: 500; }
    </style>
  </head>
  <body>
    <div id="root" data-layout-allow-overflow data-composition-id="main" data-start="0" data-duration="4" data-width="1080" data-height="1920">
      <div id="glow" data-layout-allow-overflow class="clip" data-start="0" data-duration="4" data-track-index="0"></div>
      <h1 id="marca" class="clip" data-start="0" data-duration="4" data-track-index="1">Tumbao</h1>
      <p id="lema" class="clip" data-start="0" data-duration="4" data-track-index="2">Baila pa' sanar</p>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#glow", { scale: 0.4, opacity: 0 }, { scale: 1, opacity: 0.55, duration: 1.4, ease: "power2.out" }, 0);
      tl.fromTo("#marca", { opacity: 0, y: 80, scale: 0.92 }, { opacity: 1, y: 0, scale: 1, duration: 0.8, ease: "back.out(1.6)" }, 0.3);
      tl.fromTo("#lema", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 1.0);
      tl.to(["#marca", "#lema"], { opacity: 0, y: -40, duration: 0.5, ease: "power2.in", stagger: 0.08 }, 3.3);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
