<!doctype html>
<html lang="es" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #08090c;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        background: #08090c;
      }
      #glow {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 1500px;
        height: 1500px;
        margin: -750px 0 0 -750px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(212, 175, 105, 0.22) 0%, rgba(212, 175, 105, 0) 62%);
      }
      #stage {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 36px;
      }
      #eyebrow {
        color: #d4af69;
        font-size: 26px;
        font-weight: 500;
        letter-spacing: 0.42em;
        text-transform: uppercase;
      }
      #title {
        display: flex;
        gap: 28px;
        color: #f5f3ee;
        font-size: 150px;
        font-weight: 700;
        letter-spacing: -0.035em;
        line-height: 1.05;
      }
      .mask {
        display: inline-block;
        overflow: hidden;
        padding: 0 4px 14px;
      }
      .word {
        display: inline-block;
      }
      #rule {
        width: 360px;
        height: 3px;
        background: #d4af69;
        transform-origin: center;
      }
      #subtitle {
        color: #a8a69e;
        font-size: 34px;
        font-weight: 400;
        letter-spacing: 0.04em;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="6"
      data-width="1920"
      data-height="1080"
    >
      <div id="glow" class="clip" data-start="0" data-duration="6" data-track-index="0"></div>
      <div id="stage" class="clip" data-start="0" data-duration="6" data-track-index="1">
        <div id="eyebrow">Intro de prueba</div>
        <div id="title">
          <span class="mask"><span class="word">Tu</span></span>
          <span class="mask"><span class="word">marca</span></span>
          <span class="mask"><span class="word">en</span></span>
          <span class="mask"><span class="word">movimiento</span></span>
        </div>
        <div id="rule"></div>
        <div id="subtitle">HyperFrames · HTML → MP4</div>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });

      tl.fromTo("#glow", { scale: 0.6, opacity: 0 }, { scale: 1.15, opacity: 1, duration: 4.5, ease: "power2.out" }, 0);
      tl.fromTo("#eyebrow", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.2);
      tl.fromTo(
        ".word",
        { yPercent: 110 },
        { yPercent: 0, duration: 0.9, ease: "expo.out", stagger: 0.12 },
        0.5
      );
      tl.fromTo("#rule", { scaleX: 0 }, { scaleX: 1, duration: 0.9, ease: "power3.inOut" }, 1.5);
      tl.fromTo("#subtitle", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" }, 1.9);
      tl.to("#stage", { opacity: 0, duration: 0.5, ease: "power2.in" }, 5.4);
      tl.to("#glow", { opacity: 0, duration: 0.5, ease: "power2.in" }, 5.4);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
